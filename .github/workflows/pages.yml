# The page on GitHub Pages (https://bisforboman.github.io/shotdetector-web/): on a push to main, the merged tree checked
# (natively, the App published ahead of time on every sample, FastYuv replaced) and that same publish deployed as it is.
# main doesn't have to be up to date before a merge, so this is the merged tree's test; ci.yml doesn't run on the push.
# README, "Status" and "Checks"; decision 2026-10-24-the-page.md, "Delivery". The repository's Pages source is "GitHub
# Actions". workflow_dispatch checks and redeploys main by hand. With it, the demo clip: Sintel's trailer re-encoded by
# tools/make-samples.sh, the same file the checks run (decision "The demo clip").
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a newer one waits rather than cancelling one half done (a newer push still waiting replaces an
# older one, whose tree it holds).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Sintel's trailer, the original's SHA-256: the same pin as ci.yml's (keep the two the same).
      SINTEL_SHA256: '34bbd52a4b89fdf63c8ace50b268da26653a59508288100cd3c23de276db7931'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # As ci.yml: FFmpeg 8.1's shared build makes the samples (and the demo clip, the Sintel sample) and is the native
      # check's reference. These three steps are ci.yml's.
      - name: Install FFmpeg 8.1
        id: ffmpeg
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared

      - name: Cache Sintel's trailer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sintel
          key: sintel-${{ env.SINTEL_SHA256 }}

      - name: Download Sintel's trailer
        id: sintel
        env:
          URL: https://download.blender.org/durian/trailer/sintel_trailer-1080p.mp4
        run: |
          f=$RUNNER_TEMP/sintel/sintel_trailer-1080p.mp4
          if [ ! -f "$f" ]; then
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$f" "$URL" \
              || { echo "::error::$URL didn't download"; exit 1; }
          fi
          got=$(sha256sum < "$f" | cut -d' ' -f1)
          [ "$got" = "$SINTEL_SHA256" ] || { rm -f "$f"; echo "::error::$URL has SHA-256 $got, not the pinned $SINTEL_SHA256"; exit 1; }
          echo "$(stat -c %s "$f") bytes, SHA-256 $got"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      # The samples the checks run; the trailer's re-encode, ffprobe-verified, is the demo.
      - name: Make the samples and the demo clip
        env:
          FFMPEG: ${{ steps.ffmpeg.outputs.bin }}/ffmpeg
          LD_LIBRARY_PATH: ${{ steps.ffmpeg.outputs.bin }}
          SINTEL: ${{ steps.sintel.outputs.file }}
        run: |
          tools/make-samples.sh
          sha256sum samples/sintel_trailer-480p.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Native check (ManagedCodecs + FastYuv against FFmpeg)
        env:
          SHOTDETECTOR_FFMPEG_LIBS: ${{ steps.ffmpeg.outputs.bin }}
        run: tools/check.sh native

      # The App published ahead of time and checked on every sample against the native results: this publish is the
      # bundle deployed below, not a second one.
      - name: Publish the App ahead of time and check it
        run: tools/check.sh wasm aot

      # The bundle is the publish's wwwroot/, copied out as it is (the next step rebuilds the App in the publish folder).
      # FastYuv's license (LGPL-2.1) is copied by the core csproj to the publish root, outside it, so it goes in here;
      # .nojekyll so nothing on Pages' side touches the files. The demo clip goes in demo/, where index.html's "Try the
      # demo" fetches it.
      - name: Make the site
        id: site
        run: |
          publish=src/ShotDetectorWeb.App/bin/Release/net10.0/publish
          site=$RUNNER_TEMP/site
          cp -a "$publish/wwwroot" "$site"
          mkdir -p "$site/licenses/ShotDetector.FastYuv"
          cp "$publish/licenses/ShotDetector.FastYuv/COPYING.LGPL" "$site/licenses/ShotDetector.FastYuv/"
          mkdir -p "$site/demo"
          cp samples/sintel_trailer-480p.mp4 "$site/demo/sintel-trailer.mp4"
          touch "$site/.nojekyll"
          echo "path=$site" >> "$GITHUB_OUTPUT"

      # LGPL-2.1 (README, Licensing): a FastYuv built from its source replaces the package's in a rebuilt bundle, and
      # runs. After the site is copied out: it publishes the App again in the same folder, and deletes it.
      - name: FastYuv replaced from its source, AOT
        run: tools/check.sh replace aot

      - name: Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results
          path: out/
          if-no-files-found: ignore

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}
          include-hidden-files: true

      # LGPL-2.1 (README, Licensing): checked in the archive just uploaded, the one Pages deploys. FastYuv must be its
      # own file in _framework/ and its license must be there; the deploy job doesn't run if not. Nor without the demo.
      - name: Check the uploaded site
        run: |
          tar -tvf "$RUNNER_TEMP/artifact.tar" | tee "$RUNNER_TEMP/listing.txt" | wc -l | xargs echo "Files and folders:"
          status=0
          for f in .nojekyll index.html _framework/ShotDetector.FastYuv.wasm licenses/ShotDetector.FastYuv/COPYING.LGPL demo/sintel-trailer.mp4; do
            # A regular file (type -), not a link: tar's long listing starts with the type.
            if awk -v f="./$f" '$1 ~ /^-/ && $NF == f { found = 1 } END { exit !found }' "$RUNNER_TEMP/listing.txt"; then echo "In the site: $f"; else echo "::error::Not in the site as its own file: $f"; status=1; fi
          done
          { echo "## The site"; echo; echo '```'; awk '{print $3, $NF}' "$RUNNER_TEMP/listing.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
