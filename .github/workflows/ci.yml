# The exactness checks on every pull request, and all of them once a day on main. README, "Checks". A push to main is
# checked by pages.yml, before it deploys.
name: CI

on:
  pull_request:
  # Every sample interpreted and FastYuv replaced, which a pull request leaves to this and to pages.yml.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its run in progress; any other run has a group of its own and is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # The daily run of everything publishes each bundle twice since the threaded one (decision 2026-10-30-threads.md).
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Sintel's trailer, the original's SHA-256 (the step "Download Sintel's trailer"); quoted, so YAML never reads a
      # hash of digits as a number.
      SINTEL_SHA256: '34bbd52a4b89fdf63c8ace50b268da26653a59508288100cd3c23de276db7931'
    steps:
      # Two commits deep: a pull request's merge commit and its first parent, the base it's compared with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      # Which checks the change needs, from its files (tools/ci-scope.sh: none, native, page or all; README "Checks").
      # build is the required check, so a pull request that needs none still runs it and passes without the checks (not
      # paths-ignore: the check would never report). checks: the native check and what it needs; page: the page's smoke
      # test in Chromium too; wasm: the WebAssembly checks too, which compare against the native run, with the smoke
      # test on their AOT bundle. Anything but a pull request runs all of it.
      - name: What the change touches
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT != pull_request ]] || ! git rev-parse -q --verify HEAD^2 > /dev/null; then
            tier=all; echo "Every check ($EVENT)."
          else
            tier=$(git diff --name-only HEAD^1 HEAD | tools/ci-scope.sh)
          fi
          echo "checks=$([[ $tier != none ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "page=$([[ $tier == page || $tier == all ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "wasm=$([[ $tier == all ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          case $tier in
            none) echo "Nothing a check can see changed: no check runs." ;;
            native) echo "Only files the native check alone covers changed: native, no WebAssembly check." ;;
            page) echo "Only the page's own files changed: native, and the page in Chromium (interpreted)." ;;
            all) echo "Every check this event runs." ;;
          esac | tee -a "$GITHUB_STEP_SUMMARY"

      - if: steps.scope.outputs.checks == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - if: steps.scope.outputs.page == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # FFmpeg 8.1 with its shared libraries (BtbN's build, pinned by SHA-256): libx264 makes the samples, and
      # ShotDetector's in-process path decodes them for the reference results.
      - name: Install FFmpeg 8.1
        if: steps.scope.outputs.checks == 'true'
        id: ffmpeg
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared

      - name: Install the wasm-tools workload
        if: steps.scope.outputs.page == 'true'
        run: dotnet workload install wasm-tools

      # Playwright for the page's smoke test, pinned by tools/page-check's lockfile, and the Chromium and Firefox of that
      # version (Firefox: the page check's resume across a reload there).
      - name: Install Playwright, Chromium and Firefox
        if: steps.scope.outputs.page == 'true'
        working-directory: tools/page-check
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      # Sintel's trailer (Blender Foundation, CC-BY 3.0), the real trailer the checks run and the page's demo is made
      # from: sintel_trailer-1080p.mp4, the largest of Blender's H.264 MP4s of it (1920x1080, 24 fps, 52 s, 14.6 MB), so
      # the 480p re-encode is scaled down from the best source. Pinned by SHA-256 (Blender publishes none: recorded from
      # this workflow's first download, 2026-10-24), checked after a cache restore too.
      - name: Cache Sintel's trailer
        if: steps.scope.outputs.checks == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sintel
          key: sintel-${{ env.SINTEL_SHA256 }}

      - name: Download Sintel's trailer
        if: steps.scope.outputs.checks == 'true'
        id: sintel
        env:
          URL: https://download.blender.org/durian/trailer/sintel_trailer-1080p.mp4
        run: |
          f=$RUNNER_TEMP/sintel/sintel_trailer-1080p.mp4
          if [ ! -f "$f" ]; then
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$f" "$URL" \
              || { echo "::error::$URL didn't download"; exit 1; }
          fi
          got=$(sha256sum < "$f" | cut -d' ' -f1)
          [ "$got" = "$SINTEL_SHA256" ] || { rm -f "$f"; echo "::error::$URL has SHA-256 $got, not the pinned $SINTEL_SHA256"; exit 1; }
          echo "$(stat -c %s "$f") bytes, SHA-256 $got"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Make the samples
        if: steps.scope.outputs.checks == 'true'
        env:
          FFMPEG: ${{ steps.ffmpeg.outputs.bin }}/ffmpeg
          LD_LIBRARY_PATH: ${{ steps.ffmpeg.outputs.bin }}
          SINTEL: ${{ steps.sintel.outputs.file }}
        # The trailer's hash, to compare with the demo clip pages.yml makes from the same recipe (its step summary).
        run: |
          tools/make-samples.sh
          sha256sum samples/sintel_trailer-480p.mp4 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Native check (ManagedCodecs + FastYuv against FFmpeg)
        if: steps.scope.outputs.checks == 'true'
        env:
          SHOTDETECTOR_FFMPEG_LIBS: ${{ steps.ffmpeg.outputs.bin }}
        run: tools/check.sh native

      # Interpreted, the runtime loads an assembly only when code needs it, so this is where "no FFmpeg assembly loaded
      # at all" holds. On a pull request one short sample with audio (the audio pass is on the path), the files to
      # refuse and those without AAC; every sample once a day and by hand. The AOT check below, what the page deploys,
      # runs every sample on every pull request.
      - name: WebAssembly check, interpreted
        if: steps.scope.outputs.wasm == 'true'
        env:
          SAMPLES: ${{ github.event_name == 'pull_request' && 'samples/with-audio-320x240-25.mp4' || '' }}
        run: tools/check.sh wasm $SAMPLES

      # The page in Chromium (tools/page-check) on the bundle this step publishes, the one Pages deploys.
      - name: WebAssembly check and the page, AOT
        if: steps.scope.outputs.wasm == 'true'
        run: tools/check.sh wasm page aot

      # Only the page's own files changed: the page in Chromium on an interpreted publish, which builds faster.
      - name: The page in Chromium, interpreted
        if: steps.scope.outputs.page == 'true' && steps.scope.outputs.wasm != 'true'
        run: tools/check.sh page

      # LGPL-2.1: a FastYuv built from its source replaces the package's in a rebuilt bundle, and runs (README, Licensing).
      # Not on a pull request: pages.yml runs it before every deploy.
      - name: FastYuv replaced from its source, AOT
        if: steps.scope.outputs.wasm == 'true' && github.event_name != 'pull_request'
        run: tools/check.sh replace aot

      - name: Results
        if: always() && steps.scope.outputs.checks == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results
          path: out/
          if-no-files-found: ignore
