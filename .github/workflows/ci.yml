# The exactness checks on every pull request and push to main. README, "Checks".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Sintel's trailer, the original's SHA-256 (the step "Download Sintel's trailer"); quoted, so YAML never reads a
      # hash of digits as a number.
      SINTEL_SHA256: '34bbd52a4b89fdf63c8ace50b268da26653a59508288100cd3c23de276db7931'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # FFmpeg 8.1 with its shared libraries (BtbN's build, pinned by SHA-256): libx264 makes the samples, and
      # ShotDetector's in-process path decodes them for the reference results.
      - name: Install FFmpeg 8.1
        id: ffmpeg
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # Sintel's trailer (Blender Foundation, CC-BY 3.0), the real trailer the checks run and the page's demo is made
      # from: sintel_trailer-1080p.mp4, the largest of Blender's H.264 MP4s of it (1920x1080, 24 fps, 52 s, 14.6 MB), so
      # the 480p re-encode is scaled down from the best source. Pinned by SHA-256 (Blender publishes none: recorded from
      # this workflow's first download, 2026-10-24), checked after a cache restore too.
      - name: Cache Sintel's trailer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sintel
          key: sintel-${{ env.SINTEL_SHA256 }}

      - name: Download Sintel's trailer
        id: sintel
        env:
          URL: https://download.blender.org/durian/trailer/sintel_trailer-1080p.mp4
        run: |
          f=$RUNNER_TEMP/sintel/sintel_trailer-1080p.mp4
          if [ ! -f "$f" ]; then
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$f" "$URL" \
              || { echo "::error::$URL didn't download"; exit 1; }
          fi
          got=$(sha256sum < "$f" | cut -d' ' -f1)
          [ "$got" = "$SINTEL_SHA256" ] || { rm -f "$f"; echo "::error::$URL has SHA-256 $got, not the pinned $SINTEL_SHA256"; exit 1; }
          echo "$(stat -c %s "$f") bytes, SHA-256 $got"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Make the samples
        env:
          FFMPEG: ${{ steps.ffmpeg.outputs.bin }}/ffmpeg
          LD_LIBRARY_PATH: ${{ steps.ffmpeg.outputs.bin }}
          SINTEL: ${{ steps.sintel.outputs.file }}
        run: tools/make-samples.sh

      - name: Native check (ManagedCodecs + FastYuv against FFmpeg)
        env:
          SHOTDETECTOR_FFMPEG_LIBS: ${{ steps.ffmpeg.outputs.bin }}
        run: tools/check.sh native

      - name: WebAssembly check, interpreted
        run: tools/check.sh wasm

      - name: WebAssembly check, AOT
        run: tools/check.sh wasm aot

      # TEMPORARY (the page row's PR; reverted before it merges): the page's Done-when in Chromium and Firefox on every
      # sample, Sintel's trailer included, which the session's container can't reach. On the AOT publish the step above
      # leaves; screenshots go to the results artifact.
      - name: TEMPORARY - the page in Chromium and Firefox
        timeout-minutes: 45
        env:
          FF: ${{ steps.ffmpeg.outputs.bin }}
          LD_LIBRARY_PATH: ${{ steps.ffmpeg.outputs.bin }}
        run: |
          x=$RUNNER_TEMP/page-extra
          mkdir -p "$x" out/page-screenshots
          "$FF/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc2=s=1280x720:r=25:d=40 -c:v libx264 -preset veryfast -pix_fmt yuv420p "$x/long-1280x720-40s.mp4"
          head -c 30000 samples/cuts-854x480-25.mp4 > "$x/truncated.mp4"
          python3 -c "import sys; d=bytearray(open(sys.argv[1],'rb').read()); i=d.find(b'mdat'); d[i+200:i+4000]=bytes(3800); open(sys.argv[2],'wb').write(d)" samples/fades-320x240-25.mp4 "$x/garbled.mp4"
          truncate -s 600M "$x/big-600mb.mp4"
          pw=$RUNNER_TEMP/pw
          mkdir -p "$pw"
          (cd "$pw" && npm init -y > /dev/null && npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium firefox)
          status=0
          for b in chromium firefox; do
            NODE_PATH=$pw/node_modules node tools/page-check-temporary.cjs src/ShotDetectorWeb.App/bin/Release/net10.0/publish/wwwroot . out/page-screenshots "$x" $b | tee "out/page-$b.txt" || status=1
          done
          exit $status

      - name: Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results
          path: out/
          if-no-files-found: ignore
