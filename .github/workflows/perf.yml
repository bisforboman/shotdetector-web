# Throwaway (backlog "A first visit downloads the .NET bundle once, not twice"): the page's first visit and revisit
# measured, main's app.js against the branch's, the AOT bundle served with Pages' headers, in headless Chromium; and the
# live site. Never on main.
name: Perf bundle once

on:
  push:
    branches: [claude/perf-bundle-once]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - working-directory: tools/page-check
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Measure, live
        run: node tools/page-check/perf.mjs --url https://bisforboman.github.io/shotdetector-web/ --runs 10 --label live-after
